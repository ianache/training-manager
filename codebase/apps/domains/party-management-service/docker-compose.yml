# Ejecución aislada del servicio. Para la plataforma completa usar codebase/docker-compose.yml.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      # Sin DDL en initdb: el esquema lo crea Alembic al arrancar la API
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gestion_formacion
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@postgres:5432/gestion_formacion
      # Requiere un Keycloak accesible; el issuer debe coincidir con el `iss` de los tokens del BFF.
      KEYCLOAK_ISSUER: http://localhost:8080/realms/gestion-formacion
      KEYCLOAK_JWKS_URL: http://host.docker.internal:8080/realms/gestion-formacion/protocol/openid-connect/certs
      KEYCLOAK_ALLOWED_CLIENTS: bff-app
      API_ENVIRONMENT: development
      SEED_DEMO_DATA: "true"
    depends_on:
      postgres:
        condition: service_healthy

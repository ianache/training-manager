version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gestion_formacion
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@postgres:5432/gestion_formacion
      KEYCLOAK_URL: http://host.docker.internal:8080
      KEYCLOAK_REALM: gestion-formacion
      KEYCLOAK_CLIENT_ID: party-management-service
      KEYCLOAK_CLIENT_SECRET: secret
      KEYCLOAK_PUBLIC_KEY_URL: http://host.docker.internal:8080/realms/gestion-formacion/protocol/openid-connect/certs
      API_ENVIRONMENT: development
    depends_on:
      - postgres

volumes:
  postgres_data:

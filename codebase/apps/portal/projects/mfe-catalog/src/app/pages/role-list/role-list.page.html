<header class="page-header">
  <h1>Catálogo de roles</h1>
  <!-- UIQ-01 abierta: ¿modal o página para "Nuevo rol"? -->
  <gf-button>Nuevo rol</gf-button>
</header>

<gf-view-state [state]="state()" (retry)="retry()" loadingLabel="Cargando roles">
  <ng-template #empty>
    <gf-empty-state
      title="El catálogo todavía no tiene roles"
      description="Define el primer rol para que los proyectos puedan declarar requerimientos."
    />
  </ng-template>

  <ng-template #success let-page>
    <table class="table">
      <caption class="gf-visually-hidden">Roles del catálogo</caption>
      <thead>
        <tr>
          <th scope="col">Rol</th>
          <th scope="col">Niveles</th>
          <th scope="col">Competencias</th>
          <th scope="col">Estado</th>
        </tr>
      </thead>
      <tbody>
        @for (role of page.data; track role.id) {
          <tr>
            <th scope="row"><a [routerLink]="['roles', role.id]">{{ role.name }}</a></th>
            <td>{{ role.levelCount }}</td>
            <td>{{ role.competencyCount }}</td>
            <td>
              @if (role.status === 'defined') {
                <gf-badge tone="success">Definido</gf-badge>
              } @else {
                <gf-badge tone="neutral">Sin definir</gf-badge>
              }
            </td>
          </tr>
        }
      </tbody>
    </table>
  </ng-template>
</gf-view-state>

architecture_constraints:
  approved_adrs:            # fechas = decision.at de cada ADR
    - id: ADR-001
      title: Estructura de la plataforma (shell + microUIs Angular, BFF Node.js)
      status: Aceptado
      approved_date: "2026-09-27"
      impact: el servicio solo lo llama el BFF; sin CORS
    - id: ADR-002
      title: Autenticación Keycloak + PKCE en el BFF
      status: Aceptado
      approved_date: "2026-09-27"
      impact: el servicio valida el token de servicio del BFF (no tokens de usuario)
    - id: ADR-003
      title: Persistencia MySQL ↔ PostgreSQL
      status: Aceptado
      approved_date: "2026-09-27"
      impact: ORM portable; las migraciones actuales son solo PostgreSQL (brecha para MySQL)
    - id: ADR-004
      title: Secretos en HashiCorp Vault
      status: Aceptado
      approved_date: "2026-09-27"
      impact: sin secretos en el código
    - id: ADR-005
      title: Implementación PKCE, tokens y sesiones
      status: Aceptado
      approved_date: "2026-09-27"
      impact: "Authorization: Bearer <token de servicio del BFF> + X-User-Name (+ X-User-Roles, D-07)"
    - id: ADR-007
      title: Consolidación PostgreSQL en desarrollo local
      status: Aceptado
      approved_date: "2026-09-27"
      impact: una instancia PostgreSQL con bases gestion_formacion y keycloak en dev
    - id: ADR-008
      title: Python + FastAPI para APIs REST
      status: "Reemplazado en parte por ADR-010"
      approved_date: "2026-09-28"
      impact: stack del microservicio (sigue vigente para microservicios de dominio)
    - id: ADR-010
      title: Lenguaje del BFF — Node.js
      status: Aceptado
      approved_date: "2026-09-30"
      impact: resuelve CON-001
  rejected_adrs:
    - id: ADR-009
      title: Composición de microUIs con Native Federation
      status: Rechazado
      decided_date: "2026-09-30"
      impact: ninguno sobre este servicio
  missing_adrs:
    - id: ADR-006
      note: "v1.0 lo citaba como 'Criterios de upgrade Rol-Nivel', ACCEPTED. No existe en knowledge-base/architecture/adrs/. Si se necesita para US-019, hay que redactarlo."

technology_stack:
  framework: FastAPI (Python)
  orm: SQLAlchemy 2.0+ (async)
  validation: Pydantic v2
  database: PostgreSQL 12+
  authentication: "Token de servicio del BFF (Keycloak client_credentials) validado con JWKS; identidad del usuario por X-User-Name"
  secrets_management: HashiCorp Vault
  migration: "Alembic (dueño del esquema; docker-entrypoint.sh corre `alembic upgrade head`)"
  testing: pytest + pytest-asyncio
  api_documentation: OpenAPI (auto-generated)
  logging: structlog (JSON)
  monitoring: Prometheus + health endpoint

api_contract:
  base_path: /api/v1
  version: v1
  style: REST (resource-oriented)
  endpoints_total: 23   # operaciones distintas en API-SPEC-001 §3 (PATCH /parties/{id}/keycloak-link aparece dos veces)
  endpoints_count_note: "El encabezado de API-SPEC-001 dice 19 y el desglose por fase de v1.0 sumaba 20. US-025 (configurar plazo) no tiene endpoint en la especificación."
  endpoints_by_phase:
    phase_1: 10  # PARTY núcleo (4) + ORGANIZATION (6)
    phase_2: 6   # ROLE-ASSIGNMENT (3) + PROGRAM-ROLE (3)
    phase_3: 5   # status/baja, history, keycloak-link (PATCH, GET, DELETE)
    phase_4: 2   # GET anonymization, POST anonymize (+ US-025 sin endpoint)
    phase_5: 0   # observabilidad
  implemented:   # party-management-service 1.2.0
    - "GET /api/v1/parties"
    - "GET /api/v1/parties/{id}"
    - "POST /api/v1/parties"
    - "PATCH /api/v1/parties/{id}"

data_model:
  source: "PDM-001 (knowledge-base/architecture/data-model/ddl/party-postgresql.sql) + alineación STD-DB-001 (V003/V004)"
  schema_owner: "Alembic: 0001_pdm001_baseline + 0002_std_db_001_alignment (V003/V004 corregidos para PostgreSQL)"
  id_type: "CHAR(36) con GUID en texto"
  vigencies: "from_date / thru_date (NULL = vigente) en roles, relaciones, medios de contacto y rol-nivel"
  entities_in_use:   # las que usa la API de partes hoy
    - table: tb_party
      primary_key: pk_party_id
    - table: tb_person
      primary_key: pk_party_id
      notes: "employee_code (GUID), given_names, family_names, preferred_name, anonymized_at/by"
    - table: tb_party_role
      primary_key: pk_party_role_id
      notes: "EMPLOYEE / CONTRACTOR con vigencia; el estado active/inactive se deriva de aquí"
    - table: tb_party_identification
      primary_key: pk_party_identification_id
      notes: "DNI / CE / PASSPORT + issuing_country_code; único entre no anonimizadas"
    - table: tb_contact_mechanism
      primary_key: pk_contact_mechanism_id
      notes: "EMAIL / PHONE; correo único sin distinguir mayúsculas"
    - table: tb_party_contact_mechanism
      primary_key: pk_party_contact_mechanism_id
      notes: "WORK_EMAIL / WORK_PHONE con vigencia; un correo laboral vigente por parte"
  entities_pending:  # existen en la base; el servicio aún no las expone
    - tb_organization            # US-017, US-018
    - tb_party_relationship      # unidad, jefe directo, empleo, contratación
    - tb_role_level_assignment   # US-019
    - tb_access_identity         # US-022 (v1.0 lo llamaba tb_party_keycloak_link)
    - tb_anonymization_setting   # US-025
    - tb_anonymization_notice    # US-024
    - tb_anonymization_notice_recipient
  open_gaps:
    - "Roles del programa (US-020): PDM-001 no tiene tabla; v1.0 inventaba tb_party_program_role"
    - "Historial de cambios (GET /parties/{id}/history): PDM-001 no tiene tabla de auditoría de cambios"
    - "identification_number: VARCHAR(20) en PDM-001 vs VARCHAR(30) en API-SPEC-001 §7 (el servicio valida 20)"

authorization:
  pattern: "RBAC con roles de realm de Keycloak, recibidos del BFF en X-User-Roles (ARCHITECTURE.md D-07)"
  roles:
    - id: jefe_ingenieria
      title: Jefe de Ingeniería
      permissions:
        - create_party: true
        - read_all_parties: full_view
        - update_all_parties: true
        - assign_roles: true
        - anonymize: true
    - id: admin
      title: Administrador de la plataforma
      permissions:
        - read_all_parties: full_view
    - id: colaborador
      title: Colaborador
      permissions:
        - create_party: false
        - read_all_parties: limited_view   # P-08 / UXR-000.5: nombre, correo laboral, unidad, rol y estado; no 403
        - read_self_party: full_view_pending_US-022   # requiere tb_access_identity
        - update_self_party_partial: pending_US-022   # phone, preferred_name
        - assign_roles: false
        - anonymize: false
  note: "v1.0 usaba JEFE_INGENIERA y negaba la lectura de otros colaboradores; el realm usa jefe_ingenieria y P-08 permite la vista limitada."

security:
  findings:
    - id: SRC-001-001
      title: Rate Limiting No Vinculante
      severity: MEDIUM
      status: IMPLEMENTED
      phase: 1
      remediation: "Dependencia FastAPI propia (sin slowapi), por usuario (X-User-Name) y por operación: lectura 1000/h (10000/h prod), alta 100/h, actualización 500/h; 429 RATE_LIMIT_EXCEEDED con Retry-After y X-RateLimit-*. Contadores en memoria: pasar a Redis antes de escalar"
      evidence: "tests/security/test_rate_limit.py"
    - id: SRC-001-002
      title: SQL Injection Protection No Explícita
      severity: MEDIUM
      status: OPEN_REMEDIATION
      phase: 1
      remediation: Enforce enum validation for filters, SQLAlchemy ORM only
    - id: SRC-001-003
      title: Authorization Bypass via Direct Object Reference
      severity: MEDIUM
      status: OPEN_REMEDIATION
      phase: 1
      remediation: Early auth validation in middleware, before DB query
    - id: SRC-001-004
      title: PII Visibility Not Enforced
      severity: LOW
      status: OPEN_REMEDIATION
      phase: 1
      remediation: Redact emails/phone from error responses + logs
    - id: SRC-001-005
      title: API Error Messages Too Verbose
      severity: LOW
      status: OPEN_REMEDIATION
      phase: 1
      remediation: Use generic error messages in production
  owasp_coverage:
    - A01 Broken Access Control: IMPLEMENTED (early auth checks)
    - A03 Injection: IMPLEMENTED (SQLAlchemy ORM, enum validation)
    - A04 Insecure Design: IMPLEMENTED (vigencies pattern prevents overwrites)
    - A05 Broken Authentication: IMPLEMENTED (token validation mandatory)

fitness_criteria:
  critical_paths:
    - path: "US-015 → POST /parties"
      criteria:
        - status: "status_code == 201"
        - audit: "created_by == X-User-Name, created_at == NOW()"
        - authorization: "only Jefe can create"
      test: test_jefe_can_create_party

    - path: "US-019 → PATCH /role-assignments (vigencies)"
      criteria:
        - atomicity: "close + open in single transaction"
        - no_overwrites: "old assignment.thru_date == new assignment.from_date"
        - audit: "both assignments logged"
      test: test_vigencia_pattern_no_overwrite

    - path: "US-024 → POST /anonymize"
      criteria:
        - irreversibility: "first_names NULL, last_names NULL, email_work NULL"
        - precondition: "status == inactive AND (now - thru_date) >= 90 days"
        - audit: "anonymized_by, anonymized_at recorded"
      test: test_anonymization_irreversible

nfrs:
  performance:
    - attribute: response_time_get
      target: "<500ms (p95)"
      measurement: K6 load test (100 concurrent users)
    - attribute: response_time_post
      target: "<1000ms (p95)"
      measurement: K6 load test
    - attribute: throughput_read
      target: "10000 requests/second"
      measurement: K6
    - attribute: throughput_write
      target: "1000 requests/second"
      measurement: K6

  availability:
    - attribute: uptime
      target: "99.5%"
      measurement: Health endpoint monitoring

  scalability:
    - attribute: max_parties
      target: "1 million"
      measurement: DB index validation
    - attribute: concurrent_users
      target: "500"
      measurement: Load test

  auditability:
    - attribute: mutation_logging
      target: "100% of CREATE/UPDATE/DELETE"
      measurement: application.log audit trail verification

  backwards_compatibility:
    - attribute: api_stability
      target: "v1 stable for 18 months"
      measurement: No breaking changes without v2

assumptions:
  - id: ASM-001
    statement: Keycloak realm and client credentials available at deployment
    verified: false
    contingency: Mock Keycloak in dev/test; production requires real realm

  - id: ASM-002
    statement: Database migrations run before service startup
    verified: true   # docker-entrypoint.sh: preflight + `alembic upgrade head` + uvicorn (probado 2026-10-01)
    contingency: Docker entrypoint runs `alembic upgrade head` before uvicorn

  - id: ASM-003
    statement: UUID v4 acceptable for all primary keys (performance impact <10ms)
    verified: false
    contingency: "Benchmark test: 1000 inserts should complete in <10 seconds"

unknowns:
  - id: UNK-001
    question: Should anonymization be synchronous or async job?
    recommendation: Sync v1; async v2
    decision_owner: Tech Lead
    decision_date: null

  - id: UNK-002
    question: Should historical role assignments be queryable per role type?
    recommendation: Yes; add filter in Phase 2
    decision_owner: Product Manager
    decision_date: null

  - id: UNK-003
    question: How frequently should anonymization scheduler run?
    recommendation: Daily 2am UTC
    decision_owner: Ops Lead
    decision_date: null

conflicts:
  - id: CON-001
    description: ADR-001 (BFF Node.js) vs ADR-008 (Python APIs, incluido el BFF)
    resolution: "Resuelto por ADR-010 (human:ianache, 2026-09-30): el BFF sigue en Node.js; ADR-008 rige los microservicios de dominio. v1.0 decía 'sin conflicto', pero ADR-008 sí cambiaba el BFF."
    impact: "BFF routes POST /api/v1/parties → FastAPI at http://party-service:8000"

  - id: CON-002
    description: ADR-003 (MySQL + PostgreSQL) vs ADR-007 (PostgreSQL only)
    resolution: "ADR-007 (2026-09-27) consolida PostgreSQL en desarrollo local; no reemplaza a ADR-003. El servicio es PostgreSQL hoy y mantiene el ORM portable."
    impact: "Las migraciones Alembic son solo PostgreSQL; para MySQL hará falta una rama propia"

implementation_phases:
  phase_1:
    name: "Core PARTY + ORGANIZATION"
    duration_weeks: 2
    tasks:
      - "Task 1a: SQLAlchemy models (Party, Organization)"
      - "Task 1b: Auth middleware (X-Token, X-User-Name)"
      - "Task 1c: PARTY endpoints (POST, GET, PATCH)"
      - "Task 1d: ORGANIZATION endpoints"
      - "Task 1e: Unit + integration tests"
    exit_criteria:
      - "All Phase 1 tests passing"
      - "SRC-001 findings documented"

  phase_2:
    name: "ROLE-ASSIGNMENT + PROGRAM-ROLE"
    duration_weeks: 1
    dependencies: ["phase_1"]
    tasks:
      - "Task 2a: role_assignment endpoints"
      - "Task 2b: close-then-open vigencies (transaction test)"
      - "Task 2c: program_role endpoints"
    exit_criteria:
      - "Vigencies tests passing"
      - "No data loss on concurrent assigns"

  phase_3:
    name: "KEYCLOAK-LINK + Integration Tests"
    duration_weeks: 1
    dependencies: ["phase_2"]
    tasks:
      - "Task 3a: keycloak_link endpoints"
      - "Task 3b: E2E workflow test"
    exit_criteria:
      - "E2E test passing"
      - "Cross-module integration validated"

  phase_4:
    name: "ANONYMIZATION + Scheduler"
    duration_weeks: 1
    dependencies: ["phase_3"]
    tasks:
      - "Task 4a: Anonymization logic (irreversible NULL)"
      - "Task 4b: Scheduler (daily check)"
    exit_criteria:
      - "Anonymization irreversible"
      - "Scheduler runs without errors"

  phase_5:
    name: "Observability"
    duration_weeks: 1
    dependencies: ["phase_4"]
    tasks:
      - "Task 5a: Prometheus metrics + health endpoint"
      - "Task 5b: Structured logging (JSON)"
      - "Task 5c: Documentation + deployment guide"
    exit_criteria:
      - "Metrics exposed"
      - "Logs searchable"
      - "README complete"


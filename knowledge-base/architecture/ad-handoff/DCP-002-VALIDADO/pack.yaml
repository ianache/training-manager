architecture_constraints:
  approved_adrs:
    - id: ADR-001
      title: Estructura de la plataforma
      status: ACCEPTED
      approved_date: "2026-09-20"
      impact: shell/microservices isolation
    - id: ADR-002
      title: Autenticación Keycloak + PKCE
      status: ACCEPTED
      approved_date: "2026-09-20"
      impact: MUST validate X-Token + X-User-Name
    - id: ADR-003
      title: Persistencia MySQL ↔ PostgreSQL
      status: ACCEPTED
      approved_date: "2026-09-20"
      impact: ORM portable, no raw SQL
    - id: ADR-004
      title: Secretos en HashiCorp Vault
      status: ACCEPTED
      approved_date: "2026-09-20"
      impact: no secrets in code
    - id: ADR-005
      title: Implementación PKCE
      status: ACCEPTED
      approved_date: "2026-09-22"
      impact: token handling via BFF
    - id: ADR-006
      title: Criterios de upgrade Rol-Nivel
      status: ACCEPTED
      approved_date: "2026-09-22"
      impact: authorization matrix
    - id: ADR-007
      title: Consolidación PostgreSQL local
      status: ACCEPTED
      approved_date: "2026-09-28"
      impact: PostgreSQL-only for this service
    - id: ADR-008
      title: Python + FastAPI para APIs
      status: ACCEPTED
      approved_date: "2026-09-26"
      impact: technology stack decision

technology_stack:
  framework: FastAPI (Python)
  orm: SQLAlchemy 2.0+ (async)
  validation: Pydantic v2
  database: PostgreSQL 12+
  authentication: Keycloak (OAuth 2.0 PKCE)
  secrets_management: HashiCorp Vault
  migration: Alembic
  testing: pytest + pytest-asyncio
  api_documentation: OpenAPI (auto-generated)
  logging: structlog (JSON)
  monitoring: Prometheus + health endpoint

api_contract:
  base_path: /api/v1
  version: v1
  style: REST (resource-oriented)
  endpoints_total: 19
  endpoints_by_phase:
    phase_1: 8  # PARTY + ORGANIZATION
    phase_2: 6  # ROLE-ASSIGNMENT + PROGRAM-ROLE
    phase_3: 3  # KEYCLOAK-LINK
    phase_4: 3  # ANONYMIZATION
    phase_5: 0  # Observability (not new endpoints)

data_model:
  entities:
    - table: tb_party
      rows_estimate: 10000
      primary_key: pk_party_id (UUID)
      audit_fields: [created_by, created_at, updated_by, updated_at, anonymized_at, anonymized_by]
      vigencies: status (active|inactive|anonymized)
    - table: tb_organization
      rows_estimate: 500
      primary_key: pk_organization_id (UUID)
      audit_fields: [created_by, created_at]
    - table: tb_party_role_assignment
      rows_estimate: 50000
      primary_key: pk_assignment_id (UUID)
      audit_fields: [created_by, created_at]
      vigencies: thru_date (NULL = active)
    - table: tb_party_program_role
      rows_estimate: 5000
      primary_key: pk_program_role_id (UUID)
      audit_fields: [created_by, created_at]
      vigencies: thru_date (NULL = active)
    - table: tb_party_keycloak_link
      rows_estimate: 10000
      primary_key: pk_link_id (UUID)
      audit_fields: [linked_by, linked_at]

authorization:
  pattern: RBAC (Role-Based Access Control)
  roles:
    - id: JEFE_INGENIERA
      title: Jefe de Ingeniería
      permissions:
        - create_party: true
        - read_all_parties: true
        - update_all_parties: true
        - assign_roles: true
        - anonymize: true
    - id: COLABORADOR
      title: Colaborador
      permissions:
        - create_party: false
        - read_all_parties: false
        - read_self_party: true
        - update_self_party_partial: true  # phone, preferred_name only
        - assign_roles: false
        - anonymize: false

security:
  findings:
    - id: SRC-001-001
      title: Rate Limiting No Vinculante
      severity: MEDIUM
      status: OPEN_REMEDIATION
      phase: 1
      remediation: Implement FastAPI middleware (slowapi), per-user rate limits
    - id: SRC-001-002
      title: SQL Injection Protection No Explícita
      severity: MEDIUM
      status: OPEN_REMEDIATION
      phase: 1
      remediation: Enforce enum validation for filters, SQLAlchemy ORM only
    - id: SRC-001-003
      title: Authorization Bypass via Direct Object Reference
      severity: MEDIUM
      status: OPEN_REMEDIATION
      phase: 1
      remediation: Early auth validation in middleware, before DB query
    - id: SRC-001-004
      title: PII Visibility Not Enforced
      severity: LOW
      status: OPEN_REMEDIATION
      phase: 1
      remediation: Redact emails/phone from error responses + logs
    - id: SRC-001-005
      title: API Error Messages Too Verbose
      severity: LOW
      status: OPEN_REMEDIATION
      phase: 1
      remediation: Use generic error messages in production
  owasp_coverage:
    - A01 Broken Access Control: IMPLEMENTED (early auth checks)
    - A03 Injection: IMPLEMENTED (SQLAlchemy ORM, enum validation)
    - A04 Insecure Design: IMPLEMENTED (vigencies pattern prevents overwrites)
    - A05 Broken Authentication: IMPLEMENTED (token validation mandatory)

fitness_criteria:
  critical_paths:
    - path: "US-015 → POST /parties"
      criteria:
        - status: "status_code == 201"
        - audit: "created_by == X-User-Name, created_at == NOW()"
        - authorization: "only Jefe can create"
      test: test_jefe_can_create_party

    - path: "US-019 → PATCH /role-assignments (vigencies)"
      criteria:
        - atomicity: "close + open in single transaction"
        - no_overwrites: "old assignment.thru_date == new assignment.from_date"
        - audit: "both assignments logged"
      test: test_vigencia_pattern_no_overwrite

    - path: "US-024 → POST /anonymize"
      criteria:
        - irreversibility: "first_names NULL, last_names NULL, email_work NULL"
        - precondition: "status == inactive AND (now - thru_date) >= 90 days"
        - audit: "anonymized_by, anonymized_at recorded"
      test: test_anonymization_irreversible

nfrs:
  performance:
    - attribute: response_time_get
      target: "<500ms (p95)"
      measurement: K6 load test (100 concurrent users)
    - attribute: response_time_post
      target: "<1000ms (p95)"
      measurement: K6 load test
    - attribute: throughput_read
      target: "10000 requests/second"
      measurement: K6
    - attribute: throughput_write
      target: "1000 requests/second"
      measurement: K6

  availability:
    - attribute: uptime
      target: "99.5%"
      measurement: Health endpoint monitoring

  scalability:
    - attribute: max_parties
      target: "1 million"
      measurement: DB index validation
    - attribute: concurrent_users
      target: "500"
      measurement: Load test

  auditability:
    - attribute: mutation_logging
      target: "100% of CREATE/UPDATE/DELETE"
      measurement: application.log audit trail verification

  backwards_compatibility:
    - attribute: api_stability
      target: "v1 stable for 18 months"
      measurement: No breaking changes without v2

assumptions:
  - id: ASM-001
    statement: Keycloak realm and client credentials available at deployment
    verified: false
    contingency: Mock Keycloak in dev/test; production requires real realm

  - id: ASM-002
    statement: Database migrations run before service startup
    verified: false
    contingency: Docker entrypoint runs `alembic upgrade head` before uvicorn

  - id: ASM-003
    statement: UUID v4 acceptable for all primary keys (performance impact <10ms)
    verified: false
    contingency: Benchmark test: 1000 inserts should complete in <10 seconds

unknowns:
  - id: UNK-001
    question: Should anonymization be synchronous or async job?
    recommendation: Sync v1; async v2
    decision_owner: Tech Lead
    decision_date: null

  - id: UNK-002
    question: Should historical role assignments be queryable per role type?
    recommendation: Yes; add filter in Phase 2
    decision_owner: Product Manager
    decision_date: null

  - id: UNK-003
    question: How frequently should anonymization scheduler run?
    recommendation: Daily 2am UTC
    decision_owner: Ops Lead
    decision_date: null

conflicts:
  - id: CON-001
    description: ADR-001 (BFF Node.js) vs ADR-008 (Python APIs)
    resolution: "BFF remains Node.js; Party Service is Python/FastAPI. No conflict; both exist."
    impact: "BFF routes POST /api/v1/parties → FastAPI at http://party-service:8000"

  - id: CON-002
    description: ADR-003 (MySQL + PostgreSQL) vs ADR-007 (PostgreSQL only)
    resolution: "ADR-007 (later, approved 2026-09-28) supersedes ADR-003 for this service"
    impact: "Implement PostgreSQL-only; keep ORM portable for future"

implementation_phases:
  phase_1:
    name: "Core PARTY + ORGANIZATION"
    duration_weeks: 2
    tasks:
      - "Task 1a: SQLAlchemy models (Party, Organization)"
      - "Task 1b: Auth middleware (X-Token, X-User-Name)"
      - "Task 1c: PARTY endpoints (POST, GET, PATCH)"
      - "Task 1d: ORGANIZATION endpoints"
      - "Task 1e: Unit + integration tests"
    exit_criteria:
      - "All Phase 1 tests passing"
      - "SRC-001 findings documented"

  phase_2:
    name: "ROLE-ASSIGNMENT + PROGRAM-ROLE"
    duration_weeks: 1
    dependencies: ["phase_1"]
    tasks:
      - "Task 2a: role_assignment endpoints"
      - "Task 2b: close-then-open vigencies (transaction test)"
      - "Task 2c: program_role endpoints"
    exit_criteria:
      - "Vigencies tests passing"
      - "No data loss on concurrent assigns"

  phase_3:
    name: "KEYCLOAK-LINK + Integration Tests"
    duration_weeks: 1
    dependencies: ["phase_2"]
    tasks:
      - "Task 3a: keycloak_link endpoints"
      - "Task 3b: E2E workflow test"
    exit_criteria:
      - "E2E test passing"
      - "Cross-module integration validated"

  phase_4:
    name: "ANONYMIZATION + Scheduler"
    duration_weeks: 1
    dependencies: ["phase_3"]
    tasks:
      - "Task 4a: Anonymization logic (irreversible NULL)"
      - "Task 4b: Scheduler (daily check)"
    exit_criteria:
      - "Anonymization irreversible"
      - "Scheduler runs without errors"

  phase_5:
    name: "Observability"
    duration_weeks: 1
    dependencies: ["phase_4"]
    tasks:
      - "Task 5a: Prometheus metrics + health endpoint"
      - "Task 5b: Structured logging (JSON)"
      - "Task 5c: Documentation + deployment guide"
    exit_criteria:
      - "Metrics exposed"
      - "Logs searchable"
      - "README complete"

